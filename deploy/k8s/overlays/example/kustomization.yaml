apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ghidra-mcp
resources:
  - ../../base
  - ingress.yaml
# Pin to a concrete image tag in production (e.g. the built git SHA) and bump it from
# your own GitOps tooling — ArgoCD Image Updater, or a `newTag` bump in your infra repo.
images:
  - name: ghcr.io/jaenster/ghidra-mcp-remote
    newTag: latest
configMapGenerator:
  - name: ghidra-mcp-config
    envs:
      - config.env
