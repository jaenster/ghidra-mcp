# Builds a linux/amd64 image (GitHub runners are amd64 → native, fast, no QEMU)
# and pushes to ghcr.io. The built-in GITHUB_TOKEN can push to your own ghcr.
name: build
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jaenster/${{ github.event.repository.name }}:latest
            ghcr.io/jaenster/${{ github.event.repository.name }}:${{ github.sha }}

  # Pin the GitOps overlay to the freshly-built SHA so ArgoCD rolls it out
  # (keeps git the source of truth — no in-cluster image-updater controller).
  # Requires repo secret GITOPS_TOKEN: a fine-grained PAT with Contents:write
  # on jaenster/gitops. Skipped automatically if the secret is absent.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Bump image tag in GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "GITOPS_TOKEN not set — skipping GitOps bump."; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/jaenster/gitops.git" repo
          cd repo
          F=gitops/projects/ghidra-mcp/overlays/ghidra/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" "$F"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "already at ${GITHUB_SHA}"; exit 0; fi
          git commit -am "ghidra-mcp: roll to ${GITHUB_SHA}"
          git push
