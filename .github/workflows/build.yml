# Builds a linux/amd64 image (GitHub runners are amd64 → native, fast, no QEMU)
# and pushes to ghcr.io. The built-in GITHUB_TOKEN can push to your own ghcr.
name: build
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

  # Deployment is intentionally decoupled from this repo. The image is published to
  # ghcr.io on every push to main; roll it out from your own GitOps setup — e.g. ArgoCD
  # Image Updater watching the package, or a kustomize `newTag` bump in your infra repo.
  # See deploy/k8s/ for a self-host kustomize template.
