# Builds a linux/amd64 image (GitHub runners are amd64 → native, fast, no QEMU)
# and pushes to ghcr.io. The built-in GITHUB_TOKEN can push to your own ghcr.
name: build
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jaenster/${{ github.event.repository.name }}:latest
            ghcr.io/jaenster/${{ github.event.repository.name }}:${{ github.sha }}

  # Pin the GitOps overlay to the freshly-built SHA so ArgoCD rolls it out.
  # Uses a deploy key (GITOPS_SSH_KEY secret) with write access to jaenster/gitops.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Bump image tag in GitOps repo
        env:
          GITOPS_SSH_KEY: ${{ secrets.GITOPS_SSH_KEY }}
        run: |
          if [ -z "$GITOPS_SSH_KEY" ]; then
            echo "GITOPS_SSH_KEY not set — skipping GitOps bump."; exit 0
          fi
          mkdir -p ~/.ssh
          echo "$GITOPS_SSH_KEY" > ~/.ssh/gitops_key
          chmod 600 ~/.ssh/gitops_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gitops_key -o StrictHostKeyChecking=no"
          git clone --depth 1 git@github.com:jaenster/gitops.git repo
          cd repo
          F=gitops/projects/ghidra-mcp/overlays/ghidra/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" "$F"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "already at ${GITHUB_SHA}"; exit 0; fi
          git commit -am "ghidra-mcp: roll to ${GITHUB_SHA}"
          git push
