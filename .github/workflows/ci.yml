# Lean CI: build the pnpm workspace, typecheck, and run the Ghidra-free OAuth
# e2e tests. (The image build lives in build.yml; the heavy Ghidra analysis e2e
# suites need fixtures and run locally.)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm run typecheck
      - run: node --test --test-timeout=120000 --import tsx test/e2e/auth.test.ts
